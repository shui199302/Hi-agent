name: hi-agent-vllm

services:
  vllm:
    image: vllm/vllm-openai:v0.23.0
    restart: unless-stopped
    ipc: host
    ports:
      - "${VLLM_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - vllm-cache:/root/.cache/huggingface
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --model
      - "${VLLM_MODEL:-__SET_VLLM_MODEL__}"
      - --served-model-name
      - "${VLLM_SERVED_MODEL_NAME:-${VLLM_MODEL:-__SET_VLLM_MODEL__}}"
      - --api-key
      - "${VLLM_API_KEY:-local-dev-token}"
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "${VLLM_TOOL_CALL_PARSER:-hermes}"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  vllm-cache:
