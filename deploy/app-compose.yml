name: hi-agent

services:
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HI_AGENT_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HI_AGENT_HOST: 127.0.0.1
      HI_AGENT_PORT: 8787
      HI_AGENT_DATA_DIR: /app/data
      HI_AGENT_WEB_DIST_DIR: /app/web/dist
      HI_AGENT_SKILLS_DIR: /app/skills
      HI_AGENT_LLM_BASE_URL: "${HI_AGENT_LLM_BASE_URL:-http://host.docker.internal:8000/v1}"
      HI_AGENT_LLM_MODEL: "${HI_AGENT_LLM_MODEL:-}"
      HI_AGENT_LLM_API_KEY: "${HI_AGENT_LLM_API_KEY:-}"
      HI_AGENT_EMBEDDING_MODEL: "${HI_AGENT_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}"
    volumes:
      - hi-agent-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hi-agent-data:
