name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv run mypy src
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test -- --run
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync --all-extras --dev
        working-directory: backend
      - run: uv sync --dev
        working-directory: mcp_servers
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: uv run pytest
        working-directory: mcp_servers
      - run: ./scripts/smoke.sh
      - run: docker compose --env-file deploy/vllm.env.example -f deploy/vllm-compose.yml config --quiet
      - run: docker compose -f deploy/app-compose.yml config --quiet
