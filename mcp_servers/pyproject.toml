[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hi-agent-mcp-servers"
version = "0.1.0"
description = "Read-only workspace, calculator, and time MCP server for Hi-agent"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=1.18,<2"]

[project.scripts]
hi-agent-mcp = "hi_agent_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/hi_agent_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
